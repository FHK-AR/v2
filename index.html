<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AR フォトフレーム</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; }
    #video-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
    video { width: 100%; height: 100%; object-fit: cover; }
    
    #chroma-canvas {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      z-index: 2; pointer-events: none; object-fit: contain;
    }

    /* シャッターボタンの見た目 */
    #shutter-btn {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      width: 70px;
      height: 70px;
      background-color: #ffffff;
      border: 4px solid rgba(255, 255, 255, 0.6);
      border-radius: 50%;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      cursor: pointer;
      outline: none;
    }
    #shutter-btn:active {
      transform: translateX(-50%) scale(0.9);
      background-color: #dddddd;
    }
  </style>
</head>
<body>
  <div id="video-container">
    <video id="camera" autoplay playsinline muted></video>
  </div>
  
  <canvas id="chroma-canvas"></canvas>

  <!-- シャッターボタン -->
  <button id="shutter-btn" aria-label="写真を撮影"></button>

  <script>
    const frameSrc = 'frame1.png';
    const canvas = document.getElementById('chroma-canvas');
    const ctx = canvas.getContext('2d');
    const video = document.getElementById('camera');
    const img = new Image();

    img.src = frameSrc;
    img.onload = () => {
      canvas.width = img.width;
      canvas.height = img.height;
      ctx.drawImage(img, 0, 0);

      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const data = imgData.data;

      // クロマキー透過処理
      for (let i = 0; i < data.length; i += 4) {
        const r = data[i];
        const g = data[i + 1];
        const b = data[i + 2];
        if (g > 90 && g > r * 1.1 && g > b * 1.1) {
          data[i + 3] = 0;
        }
      }
      ctx.putImageData(imgData, 0, 0);
    };

    // カメラ起動
    navigator.mediaDevices.getUserMedia({
      video: { facingMode: "user" },
      audio: false
    }).then(stream => {
      video.srcObject = stream;
    }).catch(err => {
      alert("カメラの起動に失敗しました: " + err);
    });

    // --- シャッターボタン押下時の撮影・保存処理 ---
    document.getElementById('shutter-btn').addEventListener('click', () => {
      // 撮影合成用の非表示キャンバスを作成
      const saveCanvas = document.createElement('canvas');
      const saveCtx = saveCanvas.getContext('2d');
      
      saveCanvas.width = canvas.width || 1080;
      saveCanvas.height = canvas.height || 1920;

      // 1. カメラ映像を描画
      saveCtx.drawImage(video, 0, 0, saveCanvas.width, saveCanvas.height);
      
      // 2. その上にフレームを描画
      saveCtx.drawImage(canvas, 0, 0, saveCanvas.width, saveCanvas.height);

      // 3. 画像データ（PNG）としてダウンロード発火
      const link = document.createElement('a');
      link.download = 'ar-photo.png';
      link.href = saveCanvas.toDataURL('image/png');
      link.click();
    });
  </script>
</body>
</html>
