<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AR フォトフレーム</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; }
    
    /* 1. カメラ映像（最背面） */
    #video-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
    video { width: 100%; height: 100%; object-fit: cover; }
    
    /* 2. フレーム画像（中間） */
    #chroma-canvas {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      z-index: 2; pointer-events: none; object-fit: contain;
    }

    /* 3. ボタン配置エリア（最前面・絶対に隠れない領域） */
    #ui-container {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100vw;
      height: 120px;
      z-index: 100; /* 画像より確実に前に配置 */
      display: flex;
      justify-content: center;
      align-items: center;
      pointer-events: auto;
    }

    /* シャッターボタンのデザイン */
    #shutter-btn {
      width: 70px;
      height: 70px;
      background-color: #ffffff;
      border: 5px solid rgba(255, 255, 255, 0.8);
      border-radius: 50%;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
      cursor: pointer;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }
    #shutter-btn:active {
      transform: scale(0.9);
      background-color: #cccccc;
    }
  </style>
</head>
<body>
  <!-- カメラ映像 -->
  <div id="video-container">
    <video id="camera" autoplay playsinline muted></video>
  </div>
  
  <!-- フレーム画像を描画するキャンバス -->
  <canvas id="chroma-canvas"></canvas>

  <!-- 最前面に固定配置するボタンエリア -->
  <div id="ui-container">
    <button id="shutter-btn" aria-label="写真を撮影"></button>
  </div>

  <script>
    const frameSrc = 'frame1.png';
    const canvas = document.getElementById('chroma-canvas');
    const ctx = canvas.getContext('2d');
    const video = document.getElementById('camera');
    const img = new Image();

    // 1. フレーム画像の読み込みとクロマキー（緑色透過）処理
    img.src = frameSrc;
    img.onload = () => {
      canvas.width = img.width;
      canvas.height = img.height;
      ctx.drawImage(img, 0, 0);

      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const data = imgData.data;

      for (let i = 0; i < data.length; i += 4) {
        const r = data[i];
        const g = data[i + 1];
        const b = data[i + 2];
        if (g > 90 && g > r * 1.1 && g > b * 1.1) {
          data[i + 3] = 0;
        }
      }
      ctx.putImageData(imgData, 0, 0);
    };

    // 2. カメラの起動
    navigator.mediaDevices.getUserMedia({
      video: { facingMode: "user" },
      audio: false
    }).then(stream => {
      video.srcObject = stream;
    }).catch(err => {
      alert("カメラの起動に失敗しました: " + err);
    });

    // 3. シャッターボタンを押した時の保存処理
    document.getElementById('shutter-btn').addEventListener('click', () => {
      const saveCanvas = document.createElement('canvas');
      const saveCtx = saveCanvas.getContext('2d');

      const width = video.videoWidth || 1080;
      const height = video.videoHeight || 1920;

      saveCanvas.width = width;
      saveCanvas.height = height;

      // カメラ映像を描画
      saveCtx.drawImage(video, 0, 0, width, height);
      // その上にフレーム画像を重ねて描画
      saveCtx.drawImage(canvas, 0, 0, width, height);

      // 画像ファイルを作成して保存を実行
      const link = document.createElement('a');
      link.download = 'photo.png';
      link.href = saveCanvas.toDataURL('image/png');
      link.click();
    });
  </script>
</body>
</html>
