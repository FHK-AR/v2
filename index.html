<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AR フォトフレーム</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; }
    
    #video-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
    video { width: 100%; height: 100%; object-fit: cover; }
    
    #frame-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: calc(100vh - 100px);
      z-index: 2; pointer-events: none;
      background-size: contain; background-position: center; background-repeat: no-repeat;
    }

    #ui-container {
      position: fixed; bottom: 0; left: 0; width: 100vw; height: 100px;
      background-color: rgba(0, 0, 0, 0.4); z-index: 9999;
      display: flex; justify-content: center; align-items: center;
    }

    #shutter-btn {
      width: 65px; height: 65px; background-color: #ffffff;
      border: 4px solid #ffffff; border-radius: 50%;
      box-shadow: 0 0 10px rgba(0,0,0,0.8); cursor: pointer; outline: none;
    }

    #result-modal {
      display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.85); z-index: 10000;
      flex-direction: column; justify-content: center; align-items: center;
    }
    #result-img { max-width: 85%; max-height: 70vh; border-radius: 8px; box-shadow: 0 0 20px rgba(255,255,255,0.2); }
    #modal-msg { color: #fff; margin: 15px 0; font-size: 14px; font-weight: bold; text-align: center; }
    #close-btn { padding: 10px 25px; background: #ffffff; border: none; border-radius: 20px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>
  <div id="video-container">
    <video id="camera" autoplay playsinline muted></video>
  </div>
  
  <div id="frame-overlay"></div>

  <div id="ui-container">
    <button id="shutter-btn" aria-label="写真を撮影"></button>
  </div>

  <div id="result-modal">
    <img id="result-img" alt="撮影した写真">
    <p id="modal-msg">画像を長押しして「"写真"に保存」を選択してください</p>
    <button id="close-btn">もう一度撮影する</button>
  </div>

  <script>
    const video = document.getElementById('camera');
    const frameOverlay = document.getElementById('frame-overlay');
    const frameImage = new Image();
    let isImageLoaded = false;

    // 1. 画像の確実な事前読み込み（エラー防止）
    const imagePath = 'frame1.png';
    frameImage.src = imagePath;
    frameImage.onload = () => {
      isImageLoaded = true;
      frameOverlay.style.backgroundImage = `url('${imagePath}')`;
    };
    frameImage.onerror = () => {
      alert("フレーム画像の読み込みに失敗しました。ファイル名(frame1.png)を確認してください。");
    };

    // 2. カメラ起動処理（フォールバック機能付き）
    async function startCamera() {
      // 第一希望：インカメラ（自撮り）
      const primaryConstraints = { video: { facingMode: "user" }, audio: false };
      // 第二希望（失敗時の代替）：標準のカメラ機能
      const fallbackConstraints = { video: true, audio: false };

      try {
        const stream = await navigator.mediaDevices.getUserMedia(primaryConstraints);
        video.srcObject = stream;
      } catch (err) {
        console.warn("インカメラの起動に失敗。代替設定で再試行します:", err);
        try {
          const fallbackStream = await navigator.mediaDevices.getUserMedia(fallbackConstraints);
          video.srcObject = fallbackStream;
        } catch (fallbackErr) {
          alert("カメラを起動できませんでした。\nブラウザのアクセス許可（権限）をオンにするか、Safari/Chromeなどの標準ブラウザで開き直してください。");
        }
      }
    }

    startCamera();

    // 3. シャッター処理
    document.getElementById('shutter-btn').addEventListener('click', () => {
      if (!isImageLoaded) {
        alert("画像の読み込み中です。少し待ってから再度押してください。");
        return;
      }

      const saveCanvas = document.createElement('canvas');
      const saveCtx = saveCanvas.getContext('2d');

      const width = video.videoWidth || 1080;
      const height = video.videoHeight || 1920;

      saveCanvas.width = width;
      saveCanvas.height = height;

      saveCtx.drawImage(video, 0, 0, width, height);
      saveCtx.drawImage(frameImage, 0, 0, width, height);

      const resultImg = document.getElementById('result-img');
      resultImg.src = saveCanvas.toDataURL('image/png');
      document.getElementById('result-modal').style.display = 'flex';
    });

    document.getElementById('close-btn').addEventListener('click', () => {
      document.getElementById('result-modal').style.display = 'none';
    });
  </script>
</body>
</html>
