<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AR フォトフレーム</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; }
    #video-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
    video { width: 100%; height: 100%; object-fit: cover; }
    
    /* フレーム画像が絶対に切れず、かつカメラ映像の上に綺麗に乗る設定 */
    #chroma-canvas {
      position: fixed; 
      top: 0; 
      left: 0; 
      width: 100vw; 
      height: 100vh;
      z-index: 2; 
      pointer-events: none; 
      object-fit: contain; /* 文字や枠が画面外に切れるのを防止 */
    }
  </style>
</head>
<body>
  <!-- カメラ映像 -->
  <div id="video-container">
    <video id="camera" autoplay playsinline muted></video>
  </div>
  
  <!-- クロマキー処理後のフレームを描画 -->
  <canvas id="chroma-canvas"></canvas>

  <script>
    const frameSrc = 'frame1.png';

    const img = new Image();
    img.src = frameSrc;
    img.onload = () => {
      const canvas = document.getElementById('chroma-canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = img.width;
      canvas.height = img.height;

      ctx.drawImage(img, 0, 0);

      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const data = imgData.data;

      // クロマキー透過処理
      for (let i = 0; i < data.length; i += 4) {
        const r = data[i];
        const g = data[i + 1];
        const b = data[i + 2];

        if (g > 90 && g > r * 1.1 && g > b * 1.1) {
          data[i + 3] = 0;
        }
      }
      ctx.putImageData(imgData, 0, 0);
    };

    // カメラ起動
    const video = document.getElementById('camera');
    navigator.mediaDevices.getUserMedia({
      video: { facingMode: "user" },
      audio: false
    }).then(stream => {
      video.srcObject = stream;
    }).catch(err => {
      alert("カメラの起動に失敗しました: " + err);
    });
  </script>
</body>
</html>
